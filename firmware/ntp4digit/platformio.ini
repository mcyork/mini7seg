; ntp4digit — dev copy of the 7segclock firmware, built against THIS library checkout.
;
; The canonical firmware repo is github.com/mcyork/7segclock; that is the only
; place releases are cut and the only image fielded devices ever download. This
; copy exists so the firmware can be built against the library two levels up
; (symlink below) while both are being changed. src/ is kept byte-identical with
; 7segclock/src — edit one, copy to the other, and `diff -rq` before committing.
;
;   pio run                      # build
;   pio run -t upload            # build + flash over USB
;   pio device monitor           # serial at 115200
;
; PlatformIO rather than arduino-cli: arduino-cli bundles an x86-only ctags, so
; its build dies in the preprocessor on an Apple Silicon Mac without Rosetta.
;
; PINNED, deliberately, and identically to 7segclock/platformio.ini. An unpinned
; `platform = espressif32` resolves to whatever is installed — on the dev machine
; it silently picked a locally installed pioarduino fork, while a clean checkout
; would pick the official platform with a different Arduino core. A release must
; be rebuildable from its tag, so every dependency names an exact version.

[env:c3supermini]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board     = esp32-c3-devkitm-1   ; same silicon + 4 MB flash as the Super Mini
framework = arduino

; min_spiffs: two 1.92 MB app slots so OTA has somewhere to write the new image
; while the old one runs. The app is ~1.39 MB, so ~530 KB of headroom. nvs sits at
; the same offset (0x9000) as in the default table, so switching schemes did not
; lose saved wifi credentials or settings.
; ⚠ The partition table is part of the frozen release contract: OTA cannot change
; it, so every future build must keep min_spiffs.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed  = 921600

; The Super Mini has no USB-UART bridge — the C3's own USB-Serial-JTAG is the
; only port. Without CDC-on-boot there is no Serial at all, and the one line
; that prints the setup portal's address goes nowhere.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  fastled/FastLED@3.10.5
  symlink://../..               ; the mini7seg library itself (String7Segment)
