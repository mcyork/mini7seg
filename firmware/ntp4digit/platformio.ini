; ntp4digit — ESP32-C3 Super Mini
;
; PlatformIO rather than arduino-cli: arduino-cli 1.5.1 bundles an x86-only
; ctags and this machine has no Rosetta, so its build dies in the preprocessor
; before it ever reaches a compiler. PlatformIO is ARM-native throughout.
;
;   ~/.platformio/penv/bin/pio run              # build
;   ~/.platformio/penv/bin/pio run -t upload    # build + flash
;   ~/.platformio/penv/bin/pio device monitor   # serial at 115200
;
; First build downloads toolchain-riscv32-esp — only the xtensa one was present,
; since nothing on this machine had targeted a C3 before.

[env:c3supermini]
platform  = espressif32
board     = esp32-c3-devkitm-1   ; same silicon + 4 MB flash as the Super Mini
framework = arduino

; Conventional layout: the sketch lives at src/main.cpp. It was ntp4digit.ino
; in the project root with src_dir = "." — PlatformIO never ran its .ino
; conversion on that, so nothing from src was compiled and the link failed with
; "undefined reference to setup()" while every framework object built fine.

; Default partitions give the app 1.31 MB (half of 4 MB, because the table
; reserves a second OTA slot). Adding mDNS took us to 90.4% of that — one more
; library and the build fails on a size check rather than anything meaningful.
; huge_app spends the unused OTA slot on the application: 3 MB, no OTA. We flash
; over USB anyway.
; min_spiffs, not huge_app: two 1.92 MB app slots so OTA has somewhere to write
; the new image while the old one is running. We use 1.19 MB, so it fits with
; ~740 MB spare. The nvs partition sits at the same offset (0x9000) in both
; tables, so switching schemes does NOT lose the wifi credentials or settings.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed  = 921600

; The Super Mini has no USB-UART bridge — the C3's own USB-Serial-JTAG is the
; only port. Without CDC-on-boot there is no Serial at all, and the one line
; that prints the setup portal's address goes nowhere.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  fastled/FastLED@^3.10.0
  symlink://../..               ; the mini7seg library itself (String7Segment)
