name=Mini7Seg
version=1.1.0
author=Ian McCutcheon
maintainer=Ian McCutcheon <ian@mcyork.com>
sentence=Drive 7-segment displays made from WS2812/NeoPixel addressable LEDs.
paragraph=Build custom 7-segment displays from addressable RGB LEDs. Writes into a CRGB (or any 3/4-byte RGB(W)) array you own, so it shares a strip with other effects. Single or multiple digits, configurable LEDs per segment for large displays, overwrite/preserve/blend background modes, spin animations. Every example uses FastLED, so it is declared as a dependency; the library code itself needs nothing but the array you pass it.
category=Display
url=https://github.com/mcyork/mini7seg
architectures=*
includes=Mini7Seg.h
depends=FastLED
